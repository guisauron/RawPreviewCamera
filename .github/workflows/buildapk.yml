name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle CLI
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Installed Gradle
        run: |
          # Encontra onde esta o build.gradle do projeto
          BUILD_FILE=$(find . -name build.gradle -not -path "*/app/*" | head -n 1)
          
          if [ -n "$BUILD_FILE" ]; then
            PROJECT_DIR=$(dirname "$BUILD_FILE")
            cd "$PROJECT_DIR"
            gradle assembleDebug --stacktrace
          else
            echo "Arquivo build.gradle nao encontrado."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RawPreviewCam-apk
          path: '**/*.apk'
